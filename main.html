<!DOCTYPE html>
<html>
<head>
    <title>E-commerce</title>
</head>
<body>

    <h1>Products</h1>

    {% for product in products %}

        <h2>{{ product.name }}</h2>

        <p>${{ product.price }}</p>

        <a href="/buy/{{ product.id }}">
            Add To Cart
        </a>

        <hr>

    {% endfor %}

</body>
</html>
